<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background: #080e1a; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2979ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1">
    MATCH<tspan fill="#2979ff">IQ</tspan> SYSTEM ARCHITECTURE
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#90a4ae" font-size="13">
    End-to-End Predictor · Time-Aware Anti-Leakage Pipeline · Explainable AI (SHAP)
  </text>

  <!-- Frontend Layer -->
  <rect x="50" y="90" width="800" height="70" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="65" y="105" width="40" height="40" rx="8" fill="url(#blueGrad)" filter="url(#glow)"/>
  <text x="85" y="130" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">⚛</text>
  <text x="120" y="125" fill="#ffffff" font-size="16" font-weight="700">React 19 + TypeScript SPA (Vite / Nginx)</text>
  <text x="120" y="145" fill="#90a4ae" font-size="12">Dashboard · Predictor · Team Analytics · League Standings · TanStack Query · Recharts</text>

  <!-- Connection Line -->
  <line x1="450" y1="160" x2="450" y2="195" stroke="#2979ff" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="445,195 455,195 450,202" fill="#2979ff"/>
  <text x="465" y="185" fill="#2979ff" font-size="11" font-weight="600">REST API (JSON)</text>

  <!-- Backend Layer -->
  <rect x="50" y="205" width="800" height="90" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="65" y="225" width="40" height="40" rx="8" fill="url(#greenGrad)"/>
  <text x="85" y="250" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">⚡</text>
  <text x="120" y="240" fill="#ffffff" font-size="16" font-weight="700">FastAPI REST Backend (Python 3.11/3.13)</text>
  <text x="120" y="260" fill="#90a4ae" font-size="12">Lifespan Handler · Pydantic v2 Validation · Repository Pattern · SQLAlchemy 2.0 ORM</text>
  <text x="120" y="280" fill="#546e7a" font-size="11">Endpoints: /predict, /teams, /matches, /leagues, /analytics, /health, /model/info</text>

  <!-- Connection Lines Bottom -->
  <line x1="250" y1="295" x2="250" y2="340" stroke="#00e676" stroke-width="2"/>
  <line x1="650" y1="295" x2="650" y2="340" stroke="#7c3aed" stroke-width="2"/>

  <!-- Database Box -->
  <rect x="100" y="340" width="300" height="75" rx="10" fill="rgba(18,29,54,0.8)" stroke="rgba(0,230,118,0.4)" stroke-width="1.5"/>
  <text x="250" y="365" text-anchor="middle" fill="#00e676" font-size="14" font-weight="700">PostgreSQL 16 Database</text>
  <text x="250" y="385" text-anchor="middle" fill="#90a4ae" font-size="11">8 Relational Tables · Alembic Migrations</text>
  <text x="250" y="400" text-anchor="middle" fill="#546e7a" font-size="10">SQLite In-Memory for Pytest Isolation</text>

  <!-- ML Box -->
  <rect x="500" y="340" width="300" height="75" rx="10" fill="rgba(18,29,54,0.8)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <text x="650" y="365" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">ML Engine &amp; SHAP XAI</text>
  <text x="650" y="385" text-anchor="middle" fill="#90a4ae" font-size="11">39 Anti-Leakage Features (.shift(1))</text>
  <text x="650" y="400" text-anchor="middle" fill="#546e7a" font-size="10">Logistic Regression (57.1% Acc) + TreeExplainer</text>
</svg>
