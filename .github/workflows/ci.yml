name: MatchIQ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Backend Tests ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate dataset and model for tests
        run: |
          python scripts/fetch_real_data.py
          python -m ml.training.train

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-ci-only
          MODEL_DIR: ../ml/models
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/.pytest_cache/

  # ─── ML Training ──────────────────────────────────────────────────────────────
  ml-train:
    name: ML Training & Validation
    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ML dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch authentic historical Premier League data
        run: python scripts/fetch_real_data.py

      - name: Train ML model
        run: python -m ml.training.train

      - name: Validate model artifacts
        run: |
          python -c "
          import sys; sys.path.insert(0, 'backend')
          from app.ml.model_loader import load_model, is_model_loaded, get_model_metadata
          assert load_model(), 'Model failed to load'
          assert is_model_loaded(), 'Model not in memory'
          meta = get_model_metadata()
          assert meta['accuracy'] > 0.35, f'Accuracy too low: {meta[\"accuracy\"]}'
          print('Model validation passed:', meta['algorithm'], 'acc=', meta['accuracy'])
          "

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: ml/models/
          retention-days: 30

  # ─── Frontend Build & Test ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Run Vitest component tests
        working-directory: frontend
        run: npm run test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  # ─── Docker Build (on main only) ─────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, ml-train, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download trained ML model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: ml/models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: matchiq-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: matchiq-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Lint & Format ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff

      - name: Run ruff (backend)
        run: ruff check backend/app ml/ --select E,W,F --ignore E501

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx oxlint
        continue-on-error: true
