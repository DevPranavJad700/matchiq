version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: matchiq-postgres
    environment:
      POSTGRES_USER: matchiq
      POSTGRES_PASSWORD: matchiq
      POSTGRES_DB: matchiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matchiq-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://matchiq:matchiq@postgres:5432/matchiq
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:80","http://frontend"]'
      MODEL_DIR: ml/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchiq-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8000

volumes:
  postgres_data:
